[workspace]
resolver = "2"
members = [
    "crates/common",
    "crates/server",
    "crates/client",
]

[workspace.package]
version = "1.0.0"
edition = "2021"
authors = ["Gayrimenkul360"]
license = "MIT"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1", features = ["v4", "serde"] }
anyhow = "1"
thiserror = "1"

[profile.release]
opt-level = 2
lto = "thin"
codegen-units = 1
strip = true
